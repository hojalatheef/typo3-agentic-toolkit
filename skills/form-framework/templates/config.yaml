# EXT:my_extension/Configuration/Form/MyFormSet/config.yaml
# Form set, auto-discovered in TYPO3 ^14.2 (Feature-109412) - no TypoScript registration.
name: my-vendor/my-form-set
label: 'My extension form set'
priority: 200

persistenceManager:
  allowedExtensionPaths:
    10: 'EXT:my_extension/Resources/Private/Forms/'

prototypes:
  standard:
    formElementsDefinition:
      Form:
        renderingOptions:
          partialRootPaths:
            # Contains Iban.html (frontend partial named after the element type)
            200: 'EXT:my_extension/Resources/Private/Frontend/Partials/Form/'
        formEditor:
          editors:
            900:
              # Offer the custom finisher in the form editor's finisher select
              selectOptions:
                200:
                  value: NotifyCrm
                  label: 'Notify CRM'

      # Custom element (Feature-107058): no formEditorPartials -> the editor renders it
      # with the generic <typo3-form-form-element-stage-item> web component, no JavaScript.
      Iban:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        properties:
          containerClassAttribute: 'form-element form-element-iban mb-3'
          elementClassAttribute: form-control
          elementErrorClassAttribute: ~
          labelClassAttribute: form-label
        validators:
          - identifier: RegularExpression
            options:
              regularExpression: '/^[A-Z]{2}[0-9]{2}[A-Z0-9 ]{11,30}$/'
        formEditor:
          label: 'IBAN'
          group: custom
          groupSorting: 100
          iconIdentifier: form-text
          predefinedDefaults:
            defaultValue: ''
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label
            230:
              identifier: elementDescription
              # Feature-108966: rich text in a textarea editor (TYPO3 ^14.2)
              templateName: Inspector-TextareaEditor
              label: formEditor.elements.FormElement.editor.elementDescription.label
              propertyPath: properties.elementDescription
              enableRichtext: true
              richtextConfiguration: form-label
            800:
              identifier: requiredValidator
              templateName: Inspector-RequiredValidatorEditor
              label: formEditor.elements.FormElement.editor.requiredValidator.label
              validatorIdentifier: NotEmpty
              propertyPath: properties.fluidAdditionalAttributes.required
              propertyValue: required
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor

    finishersDefinition:
      NotifyCrm:
        implementationClassName: MyVendor\MyExtension\Domain\Finishers\NotifyCrmFinisher
        options:
          endpoint: 'https://crm.example.com/api/leads'
        formEditor:
          iconIdentifier: form-finisher
          label: 'Notify CRM'
          predefinedDefaults:
            options:
              endpoint: ''
